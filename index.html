<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field plan">
<title>Field plan · nonplusultra</title>
<meta name="description" content="Field visit planner for nonplusultra account managers: call files, routes, store history, RTS scores and sales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
--t1:#fff;--t2:#cccccc;--t3:rgba(255,255,255,.58);--blue:#0099CC;--gold:#C09F63;--goldh:#d4b87a;--green:#4CC38A;--amber:#E0A84B;--red:#F0716B;
--r:2px;--rc:6px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);color-scheme:dark}
html,body{height:100%}
body{font-family:'Poppins','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--t2);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:var(--safe-t)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,153,204,.45);border-radius:var(--r)}
h1{font-size:22px;font-weight:700;color:var(--t1);line-height:1.2}
h2{font-size:18px;font-weight:600;color:var(--t1);line-height:1.3}
h3{font-size:15px;font-weight:600;color:var(--t1)}
.muted{color:var(--t3)}.small{font-size:13px}.tiny{font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px calc(96px + var(--safe-b))}
header.top{position:sticky;top:0;z-index:1050;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
header.top img{height:15px;width:auto;opacity:.95}
.client{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-height:36px;font-size:13px;font-weight:500;color:var(--t1)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:1100;background:rgba(10,10,10,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--t3);font-size:11px;font-weight:500;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--gold)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:14px;margin:10px 0}
.card.flat{background:transparent}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;border:1px solid var(--line2);color:var(--t1);background:transparent}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.gold:hover{background:var(--goldh)}
.btn.blue{background:var(--blue);color:#000;border-color:var(--blue)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.link{color:var(--gold);font-weight:500;font-size:13px;min-height:32px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:6px 12px;border:1px solid var(--line2);border-radius:var(--r);font-size:13px;color:var(--t2);background:transparent;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--t1);color:#000;border-color:var(--t1);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--r);border:1px solid var(--line2);color:var(--t2);white-space:nowrap}
.tag.hi{color:var(--gold);border-color:rgba(192,159,99,.5)}
.tag.ok{color:var(--green);border-color:rgba(76,195,138,.45)}
.tag.warn{color:var(--amber);border-color:rgba(224,168,75,.45)}
.tag.bad{color:var(--red);border-color:rgba(240,113,107,.45)}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:10px}
.kpi b{display:block;font-size:20px;color:var(--t1);font-weight:700;line-height:1.2}
.kpi span{font-size:12px;color:var(--t3)}
.stop{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .tm{font-size:13px;font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums}
.stop .nm{color:var(--t1);font-weight:500;line-height:1.3;text-align:left;width:100%}
.stop.done .nm{color:var(--t3);text-decoration:line-through}
.tick{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.tick span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.tick[aria-pressed="true"] span{background:var(--green);border-color:var(--green);color:#000}
.next{border-color:rgba(192,159,99,.45)}
.next .big{font-size:20px;font-weight:700;color:var(--t1);line-height:1.25}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.sec-t h2{font-size:16px}
.list-i{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.list-i:first-child{border-top:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;min-height:44px;color:var(--t1)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--t3);margin:10px 0 4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1200;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1300;background:#0d0d0d;border-top:1px solid var(--line2);border-radius:12px 12px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 16px calc(24px + var(--safe-b))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;background:var(--line2);border-radius:2px;margin:4px auto 10px}
.sheet .in{max-width:760px;margin:0 auto}
.x{width:44px;height:44px;display:grid;place-items:center;color:var(--t3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--t3);text-align:center;padding:4px 0}
.cal button{min-height:54px;border:1px solid var(--line);border-radius:var(--r);padding:4px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--gold)}
.cal button .n{font-weight:600;color:var(--t1)}
.cal button .c{font-size:11px;color:var(--t3)}
.cal button.trip{background:rgba(0,153,204,.14)}
.cal button.leave{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03),rgba(255,255,255,.03) 4px,transparent 4px,transparent 8px)}
.cal button.alldone .c{color:var(--green)}
#map{height:calc(100vh - 180px - var(--safe-b) - var(--safe-t));min-height:360px;border-radius:var(--rc);border:1px solid var(--line);background:#111}
.leaflet-container{font-family:inherit;background:#111}
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111;color:var(--t2);border:1px solid var(--line2)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#aaa!important}
.leaflet-control-attribution a{color:#ccc!important}
.pin{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:grid;place-items:center;font-size:11px;font-weight:700;color:#000;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--t3);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);z-index:1400;background:#1b1b1b;border:1px solid var(--line2);color:var(--t1);border-radius:var(--rc);padding:10px 14px;font-size:14px;display:none;gap:12px;align-items:center;max-width:92vw}
.toast.on{display:flex}
.spark{display:block;width:100%;height:44px}
.rts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.rts div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;text-align:center}
.rts b{display:block;color:var(--t1);font-size:15px}
.rts span{font-size:11px;color:var(--t3)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--t3);font-weight:500;font-size:12px}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.empty{text-align:center;padding:36px 12px;color:var(--t3)}
.empty svg{width:40px;height:40px;color:var(--gold);margin-bottom:8px}
.hide{display:none!important}
.drop{border:1px dashed var(--line2);border-radius:var(--rc);padding:18px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;min-height:36px;color:var(--t2)}
.seg button[aria-pressed="true"]{background:var(--t1);color:#000;font-weight:600}
@media (min-width:900px){.wrap{max-width:980px}header.top .in,nav.tabs .in{max-width:980px}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}
</style>
</head>

<script>
'use strict';
// ===== Storage: everything lives on this device. Nothing is sent anywhere except map tiles, postcode lookups and route timings.
const KEY='npu-fieldplan-v2';
const DEF={v:2,
  settings:{name:'',homeName:'Wembley Central station',home:{lat:51.5524,lng:-0.2961},start:600,visit:45,finish:960,hardFinish:990,tripFinish:1110,workDays:[1,2,3,4],overnight:135},
  clients:[{id:'razer',name:'Razer',color:'#44D62C'}],client:'razer',
  stores:{},alias:{},plans:{},active:{},done:{},moved:{},vnotes:{},hotels:{},pins:{},
  history:[],sales:{},mileage:{},maps:{},lastBackup:null,snaps:{}};
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB){DB=JSON.parse(JSON.stringify(DEF));migrateOld()}
  for(const k in DEF)if(DB[k]===undefined)DB[k]=JSON.parse(JSON.stringify(DEF[k]));
  for(const k in DEF.settings)if(DB.settings[k]===undefined)DB.settings[k]=DEF.settings[k];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Storage is full. Back up, then clear old sales files in More.')}}
// carry over plans and ticks from the old portal if it ran on this device
function migrateOld(){try{const l=JSON.parse(localStorage.getItem('afp-plans')||'[]');l.forEach(lab=>{const o=JSON.parse(localStorage.getItem('afp-plan:'+lab)||'null');if(o&&o.meta)importLegacyPlan(o,'razer',true)})}catch(e){}}

// ===== Small helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const short=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const hm=m=>{const t=Math.round(m);return pad(Math.floor(t/60)%24)+':'+pad(t%60)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekStart=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const isoWeek=s=>{const d=parse(s);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7)};
const km=(a,b)=>{const R=6371,toR=x=>x*Math.PI/180;const dLa=toR(b.lat-a.lat),dLo=toR(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const ICON={nav:'<path d="M3 11l18-8-8 18-2-8-8-2z"/>',check:'<path d="M20 6L9 17l-5-5"/>',move:'<path d="M5 12h14M13 6l6 6-6 6"/>',store:'<path d="M4 10l1.5-6h13L20 10"/><path d="M4 10h16"/><path d="M5.5 10v10.5h13V10"/><path d="M10 20.5V15h4v5.5"/>',upload:'<path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',bars:'<rect x="3" y="12" width="4" height="8" rx="0.5"/><rect x="10" y="7" width="4" height="13" rx="0.5"/><rect x="17" y="3" width="4" height="17" rx="0.5"/>',doc:'<path d="M6 3h9l4 4v14H6V3z"/><path d="M15 3v4h4"/><line x1="9" y1="12" x2="16" y2="12"/><line x1="9" y1="16" x2="14" y2="16"/>',hotel:'<path d="M3 20V6M21 20v-6H3"/><path d="M3 14h18"/><circle cx="8" cy="10.5" r="1.8"/><path d="M12 14V9h6a3 3 0 0 1 3 3v2"/>',locate:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/>',route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',plus:'<path d="M12 5v14M5 12h14"/>',warn:'<path d="M12 3l9 16H3L12 3z"/><path d="M12 10v4M12 17v.5"/>'};
const ic=(n,cls)=>'<svg class="i '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';

// ===== Store identity: one master list shared by every client, matched by number, name or postcode
const norm=s=>String(s||'').toLowerCase().replace(/^\s*currys\s*[-:]?\s*/,'').replace(/\(.*?\)/g,' ').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\b(the|retail park|store|superstore|megastore)\b/g,' ').replace(/\s+/g,' ').trim();
const sidOf=name=>norm(name).replace(/ /g,'-')||('store-'+Math.random().toString(36).slice(2,7));
const pcRe=/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i;
function findStore(name,num,pc){
  if(num){const n=String(num).replace(/\.0$/,'').trim();for(const id in DB.stores)if(DB.stores[id].num&&String(DB.stores[id].num)===n)return id}
  const k=norm(name);if(!k)return null;
  if(DB.alias[k]&&DB.stores[DB.alias[k]])return DB.alias[k];
  const id=k.replace(/ /g,'-');if(DB.stores[id])return id;
  for(const s in DB.stores)if(norm(DB.stores[s].n)===k)return s;
  // token match: every word of the shorter name appears in the longer one, and only one store fits
  const tk=k.split(' ');const hits=[];
  for(const s in DB.stores){const t=norm(DB.stores[s].n).split(' ');const [a,b]=tk.length<=t.length?[tk,t]:[t,tk];if(a.length&&a.every(w=>b.includes(w)))hits.push(s)}
  if(hits.length===1)return hits[0];
  if(pc){const p=String(pc).toUpperCase().replace(/\s+/g,'');const m=Object.keys(DB.stores).filter(s=>DB.stores[s].pc&&DB.stores[s].pc.replace(/\s+/g,'')===p);if(m.length===1)return m[0]}
  return null}
function upsertStore(o){// o: {n,num,addr,pc,lat,lng,ret}

function rangesText(ds){const runs=[];ds.slice().sort().forEach(d=>{const r=runs[runs.length-1];if(r&&addD(r[1],1)===d)r[1]=d;else runs.push([d,d])});const f=d=>parse(d).getDate()+'/'+(parse(d).getMonth()+1);return runs.map(r=>r[0]===r[1]?f(r[0]):f(r[0])+'-'+f(r[1])).join(', ')}

    case 'hotel':{const v=prompt('Hotel for the night of '+nice(d.d),hotelName(d.d)||'');if(v!=null){const p=P();DB.hotels[p.id]=DB.hotels[p.id]||{};DB.hotels[p.id][d.d]=v;save();render();closeSheet()}break}
    case 'logrts':{const g=f=>{const x=parseFloat($('#r_'+f).value);return isNaN(x)?null:x};const v=visits().find(x=>x.k===d.k);const e2={sid:v.sid,c:DB.client,d:v.done||today(),dist:g('dist'),pl:g('pl'),pos:g('pos'),staff:g('staff'),note:'',src:'portal'};
      if([e2.dist,e2.pl,e2.pos,e2.staff].every(x=>x==null)){toast('Enter at least one score');break}e2.tot=[e2.dist,e2.pl,e2.pos,e2.staff].reduce((a,x)=>a+(x||0),0);
      const j=DB.history.findIndex(h=>h.sid===e2.sid&&h.d===e2.d&&h.c===e2.c);if(j>=0)DB.history[j]={...DB.history[j],...e2};else DB.history.push(e2);save();toast('Score saved: '+e2.tot+'/25');visitSheet(d.k);break}
    case 'summary':summarySheet();break;
    case 'copysum':{const t=$('#sumText').value;try{await navigator.clipboard.writeText(t);toast('Copied')}catch(err){$('#sumText').select();toast('Select and copy')}break}
    case 'mileage':mileageSheet();break;
    case 'milcsv':{const ds=fieldDates().filter(x=>x<=today());const rows=[['Date','Stores','Miles']].concat(ds.map(x=>{const o=DB.mileage[x];const tl=timeline(x);return[x,tl.vs.map(v=>SN(v.sid)).join(' / '),o&&o.mi!=null?o.mi:tl.mi]}));download('Mileage_'+today()+'.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');break}
    case 'cal':calSheet();break;
    case 'clients':clientsSheet();break;
    case 'addclient':{const n=$('#newClient').value.trim();if(!n)break;const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(!DB.clients.some(c=>c.id===id))DB.clients.push({id,name:n,color:'#0099CC'});DB.client=id;save();clientsSheet();render();break}
    case 'settings':settingsSheet();break;
    case 'sethome':{const q=$('#sHome').value.trim();try{const j=await (await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(q))).json();if(j.result){DB.settings.home={lat:j.result.latitude,lng:j.result.longitude};DB.settings.homeName=q.toUpperCase();save();settingsSheet();toast('Home set')}else toast('Postcode not found')}catch(err){toast('Needs a connection')}break}
    case 'savesettings':{const s=DB.settings;const tm=x=>{const[a,b]=x.split(':').map(Number);return a*60+b};s.start=tm($('#sStart').value);s.finish=tm($('#sFin').value);s.hardFinish=tm($('#sHard').value);s.tripFinish=tm($('#sTrip').value);s.visit=+$('#sVisit').value||45;s.overnight=+$('#sOver').value||135;s.cartoKey=$('#sKey').value.trim();
      s.workDays=[...document.querySelectorAll('[data-swd]')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>+b.dataset.swd);save();closeSheet();render();toast('Saved');break}
    case 'backup':backupSheet();break;
    case 'dobackup':DB.lastBackup=today();save();download('Field_plan_backup_'+today()+'.json',JSON.stringify(DB),'application/json');toast('Backup downloaded');break;
    case 'undoday':undoDaySheet();break;
    case 'clearsales':if(confirm('Clear sales data for '+C().name+'?')){delete DB.sales[DB.client];save();render()}break;
    case 'setloc':{const v=prompt('Postcode for '+SN(d.sid));if(v){try{const j=await (await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(v))).json();if(j.result){Object.assign(DB.stores[d.sid],{pc:v.toUpperCase(),lat:j.result.latitude,lng:j.result.longitude});save();storeSheet(d.sid)}else toast('Postcode not found')}catch(err){toast('Needs a connection')}}break}
  }});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fileIn'){const f=[...t.files];t.value='';if(f.length)handleFiles(f)}
  if(t.id==='planSel'){DB.active[DB.client]=t.value;save();render()}
  if(t.id==='mapDay'){MAPDAY=t.value||null;drawMap()}
  if(t.id==='mvDate'&&t.value){moveTo(t.dataset.k,t.value);closeSheet()}
  if(t.id==='doneDate'&&t.value){const p=P();DB.done[p.id][t.dataset.k]=t.value;save();render()}
  if(t.dataset.use!=null){PENDING.sheets[+t.dataset.use].use=t.checked;mapSheet()}
  if(t.id==='impCountry'){PENDING.sheets[PENDING.si].country=t.value;}
  if(t.id==='impKind'){const s=PENDING.sheets[PENDING.si];s.kind=t.value;mapSheet()}
  if(t.dataset.map){const s=PENDING.sheets[PENDING.si];if(t.value==='')delete s.m[t.dataset.map];else s.m[t.dataset.map]=+t.value;mapSheet()}
  if(t.dataset.ccolor){const c=DB.clients.find(x=>x.id===t.dataset.ccolor);c.color=t.value;save();render()}
  if(t.dataset.mil){DB.mileage[t.dataset.mil]={mi:+t.value};save()}
  if(t.id==='sumWeek'){$('#sumText').value=weeklySummary(t.value)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='stq'){STQ=t.value;const pos=t.selectionStart;render();const n=$('#stq');n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==='vnote'){const p=P();DB.vnotes[p.id]=DB.vnotes[p.id]||{};DB.vnotes[p.id][t.dataset.k]=t.value;save()}
  if(t.id==='snote'){DB.snotes=DB.snotes||{};DB.snotes[t.dataset.sid]=t.value;save()}});
$('#sheetBg').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#toastUndo').addEventListener('click',()=>{if(UNDO){UNDO();UNDO=null;render()}$('#toast').classList.remove('on')});
$('#clientBtn').addEventListener('click',clientsSheet);
// drag and drop files on desktop
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)handleFiles([...e.dataTransfer.files])});
// start
load();try{TAB=sessionStorage.getItem('fp-tab')||'today'}catch(e){}
render();
</script>
</body>
</html>
